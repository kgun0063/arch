name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: mkdir -p www && cp index.html www/ && cp node_modules/html2canvas/dist/html2canvas.min.js www/
      - run: npx cap add android
      - name: Harden + brand
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          base="android/app/src/main"
          pkg=f"{base}/java/com/arch/hub"
          os.makedirs(pkg,exist_ok=True)
          open(f"{pkg}/MainActivity.java","w").write('''package com.arch.hub;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              super.onCreate(b);
            }
          }
          '''.replace("\n          ","\n"))
          m=f"{base}/AndroidManifest.xml"
          t=open(m).read()
          t=t.replace('android:allowBackup="true"','android:allowBackup="false"')
          open(m,"w").write(t)
          shutil.rmtree(f"{base}/res/mipmap-anydpi-v26",ignore_errors=True)
          im=Image.open("icon.png").convert("RGBA")
          for d,s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p=f"{base}/res/mipmap-{d}"
              os.makedirs(p,exist_ok=True)
              r=im.resize((s,s),Image.LANCZOS)
              for n in ("ic_launcher","ic_launcher_round","ic_launcher_foreground"):
                  r.save(f"{p}/{n}.png")
